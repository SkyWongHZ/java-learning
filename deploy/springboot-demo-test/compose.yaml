name: springboot-demo-test

services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    container_name: springboot-demo-test-backend
    restart: unless-stopped
    env_file:
      - /etc/springboot-demo-test/runtime.env
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Xms128m -Xmx256m
        -Dfile.encoding=UTF-8
        -XX:+ExitOnOutOfMemoryError
    expose:
      - "18763"
    mem_limit: 384m
    pids_limit: 256
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -T 2 -O /dev/null http://127.0.0.1:18763/hello
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    networks:
      - app
      - data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    container_name: springboot-demo-test-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    mem_limit: 64m
    pids_limit: 128
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -T 2 -O /dev/null http://127.0.0.1/operation/
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  app:
    name: springboot-demo-test-app
  data:
    external: true
    name: springboot-demo-data
