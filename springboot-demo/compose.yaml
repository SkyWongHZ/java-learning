services:
  mysql:
    image: mysql:8.0
    container_name: springboot-demo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: springboot_local_root
      MYSQL_DATABASE: springboot_demo
      MYSQL_USER: springboot_app
      MYSQL_PASSWORD: springboot_local_dev
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:13306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - springboot-demo-mysql-data:/var/lib/mysql
      - ./sql/20260717_create_demo_user.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

volumes:
  springboot-demo-mysql-data:
