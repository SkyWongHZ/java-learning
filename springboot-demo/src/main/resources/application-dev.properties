# ECS self-hosted MySQL development profile.
# DB_URL is required and points to the ECS public MySQL endpoint during the
# current learning phase. Keep the real value only in the ignored local .env.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# Keep the pool deliberately small for a learning project and a 2-core ECS.
spring.datasource.hikari.pool-name=SpringbootDemoDevHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:3000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE_TIME_MS:300000}
spring.datasource.hikari.initialization-fail-timeout=${DB_INITIALIZATION_FAIL_TIMEOUT_MS:1}
# The ECS MySQL 5.7 container currently uses UTC. Align each application
# connection with the project's Asia/Shanghai date-time convention.
spring.datasource.hikari.connection-init-sql=SET time_zone = '+08:00'

# MySQL schema is initialized explicitly with the versioned scripts under sql/.
spring.sql.init.mode=never

knife4j.enable=true
springfox.documentation.enabled=true
