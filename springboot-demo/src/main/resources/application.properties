spring.application.name=springboot-demo
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=18763

# Vue/Vite development server. Override this value in other environments.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Stateful opaque-token authentication, adapted from bjsm-cloud.
app.auth.token-ttl-days=${AUTH_TOKEN_TTL_DAYS:30}
app.auth.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
app.auth.failure-window-minutes=${AUTH_FAILURE_WINDOW_MINUTES:5}
app.auth.lock-minutes=${AUTH_LOCK_MINUTES:30}
app.auth.bootstrap-username=${AUTH_BOOTSTRAP_ADMIN_USERNAME:}
app.auth.bootstrap-password=${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}
app.auth.bootstrap-display-name=${AUTH_BOOTSTRAP_ADMIN_DISPLAY_NAME:Administrator}

# Dedicated springboot-demo Redis. start-dev.sh automatically opens and closes
# the local SSH tunnel to the ECS instance.
spring.redis.host=${REDIS_HOST:127.0.0.1}
spring.redis.port=${REDIS_PORT:16379}
spring.redis.password=${REDIS_PASSWORD}
spring.redis.database=${REDIS_DATABASE:0}
spring.redis.timeout=${REDIS_TIMEOUT_MS:3000ms}
spring.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT_MS:3000ms}
spring.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:8}
spring.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:4}
spring.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:1}
spring.redis.lettuce.pool.max-wait=${REDIS_POOL_MAX_WAIT_MS:3000ms}

# REST and MyBatis-Plus common settings.
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.mvc.pathmatch.matching-strategy=ant-path-matcher
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# Spring Boot already includes SLF4J and Logback through starter-web.
logging.level.com.example.springbootdemo=INFO
