spring.application.name=springboot-demo
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=18763

# Vue/Vite development server. Override this value in other environments.
app.cors.allowed-origins=http://localhost:5173

# REST and MyBatis-Plus common settings.
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.mvc.pathmatch.matching-strategy=ant-path-matcher
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# Spring Boot already includes SLF4J and Logback through starter-web.
logging.level.com.example.springbootdemo=INFO
